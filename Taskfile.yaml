version: 3

silent: true

tasks:
  default:
    desc: "Show available tasks"
    cmds:
      - task --list-all

  pre-commit:
    desc: "Run generators, formatters, linters, tests"
    cmds:
      - task: generate
      - task: format
      - task: lint
      - task: test

  run:local:
    desc: "Run service locally"
    deps: [ firestore:up ]
    cmds:
      - go run -tags local ./cmd/telegram-butler/

  run:docker:
    desc: "Run service locally in Docker"
    deps: [ firestore:up ]
    cmds:
      - docker build -f Dockerfile.local -t telegram-butler:local .
      - docker run --rm --env-file .env -p 8080:8080 telegram-butler:local

  firestore:up:
    desc: "Start Firestore emulator container (no-op if already running)"
    cmds:
      - |
        if [ -n "$(docker ps -q -f name=^fs-emulator$)" ]; then
          echo "Firestore emulator already running on :8085"
        else
          echo "Starting Firestore emulator on :8085..."
          docker run --rm -d --name fs-emulator -p 8085:8080 mtlynch/firestore-emulator:latest
          # Boot wait — emulator takes ~2-3s to print "Dev App Server is now running"
          sleep 3
        fi

  firestore:down:
    desc: "Stop Firestore emulator container"
    cmds:
      - |
        if [ -n "$(docker ps -q -f name=^fs-emulator$)" ]; then
          docker stop fs-emulator
        else
          echo "Firestore emulator not running"
        fi

  format:
    desc: "Run formatters"
    deps: [ install:gofumpt, install:gci ]
    aliases: [ fmt ]
    cmds:
      - echo "Running formatters..."
      - go mod tidy
      - gofumpt -l -w .
      - |
        gci write \
        --skip-generated \
        --section standard \
        --section default \
        --section "prefix(github.com/GolangUA/telegram-butler)" \
        $(go list -f "{{`{{.Dir}}`}}" ./...)
    sources:
      - ./**/*.go
      - go.mod
      - go.sum

  lint:
    desc: "Run golangci-lint"
    deps: [ install:lint ]
    cmds:
      - echo "Running linters..."
      - golangci-lint run
    sources:
      - .golangci.yaml
      - ./**/*.go
      - go.mod
      - go.sum

  lint:list:
    desc: "Run golangci-lint linters (print enabled & disabled linters)"
    deps: [ install:lint ]
    cmds:
      - golangci-lint linters

  test:
    desc: "Run tests"
    cmds:
      - echo "Running tests..."
      - mkdir -p bin
      - go test -coverprofile bin/cover.out ./...
    sources:
      - ./**/*.go
      - go.mod
      - go.sum
    generates:
      - bin/cover.out

  test:cover:
    desc: "Run tests & show coverage"
    deps:
      - test
    cmds:
      - go tool cover -func bin/cover.out

  test:race:
    desc: "Run tests with a race flag"
    cmds:
      - go test -race -count=8 -failfast ./...

  generate:
    desc: "Generate (used for mock generation)"
    deps: [ install:mock ]
    cmds:
      - echo "Running generators..."
      - go generate ./...
    sources:
      - ./**/*.go
      - go.mod
      - go.sum

  install:
    desc: "Install all tools"
    deps:
      - install:lint
      - install:gofumpt
      - install:gci
      - install:mock

  install:lint:
    desc: "Install golangci-lint"
    cmds:
      - curl -sSfL https://golangci-lint.run/install.sh | sh -s -- -b $(go env GOPATH)/bin v2.11.3
    status:
      - command -v golangci-lint

  install:gofumpt:
    desc: "Install gofumpt"
    cmds:
      - go install mvdan.cc/gofumpt@latest
    status:
      - command -v gofumpt

  install:gci:
    desc: "Install gci"
    cmds:
      - go install github.com/daixiang0/gci@latest
    status:
      - command -v gci

  install:mock:
    desc: "Install mockgen"
    cmds:
      - go install go.uber.org/mock/mockgen@latest
    status:
      - command -v mockgen
