version: "2"
linters:
  default: all
  disable:
    - containedctx
    - contextcheck
    - cyclop
    - depguard
    - dupl
    - err113
    - exhaustruct
    - gochecknoglobals
    - gochecknoinits
    - godot
    - godox
    - interfacebloat
    - ireturn
    - maintidx
    - mnd
    - nakedret
    - nlreturn
    - noctx
    - nonamedreturns
    - paralleltest
    - tagliatelle
    - testableexamples
    - testpackage
    - varnamelen
    - wrapcheck
    - wsl
  settings:
    errcheck:
      check-type-assertions: true
    exhaustive:
      default-signifies-exhaustive: true
    funlen:
      lines: 140
      statements: 60
    gocognit:
      min-complexity: 40
    gocyclo:
      min-complexity: 40
    govet:
      disable:
        - composites
        - fieldalignment
      enable-all: true
    lll:
      line-length: 120
      tab-width: 4
    misspell:
      locale: US
    nestif:
      min-complexity: 7
    nolintlint:
      require-specific: true
    revive:
      enable-all-rules: true
      rules:
        - name: add-constant
          disabled: true
        - name: argument-limit
          disabled: true
        - name: banned-characters
          disabled: true
        - name: bare-return
          disabled: true
        - name: blank-imports
          disabled: true
        - name: cognitive-complexity
          disabled: true
        - name: comment-spacings
          arguments:
            - nolint
          severity: warning
          disabled: false
        - name: cyclomatic
          disabled: true
        - name: confusing-naming
          disabled: true
        - name: exported
          disabled: true
        - name: import-alias-naming
          disabled: true
        - name: file-header
          disabled: true
        - name: function-result-limit
          arguments:
            - 4
          severity: warning
          disabled: false
        - name: function-length
          disabled: true
        - name: flag-parameter
          disabled: true
        - name: import-shadowing
          disabled: true
        - name: line-length-limit
          disabled: true
        - name: max-public-structs
          disabled: true
        - name: modifies-value-receiver
          disabled: true
        - name: package-comments
          disabled: true
        - name: unused-receiver
          disabled: true
        - name: var-naming
          disabled: true
    sloglint:
      no-mixed-args: true
      kv-only: false
      attr-only: true
      static-msg: true
      no-raw-keys: false
      key-naming-case: snake
      args-on-sep-lines: true
    staticcheck:
      checks:
        - all
        - -ST1000
        - -ST1003
  exclusions:
    generated: lax
    rules:
      - linters:
          - lll
        source: '^//go:generate '
      - linters:
          - funlen
        path: _test\.go$
    paths:
      - third_party$
      - builtin$
      - examples$
issues:
  max-issues-per-linter: 0
  max-same-issues: 0
formatters:
  enable:
    - gci
    - gofmt
    - gofumpt
    - goimports
  settings:
    gci:
      sections:
        - standard
        - default
        - prefix(github.com/GolangUA/telegram-butler)
  exclusions:
    generated: lax
    paths:
      - third_party$
      - builtin$
      - examples$
